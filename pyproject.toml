[project]
name = "masters-rgbd"
version = "0.1.0"
description = "Code for controlled RGB augmentation and RGB-D surface reconstruction experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=12,<13",
  "scipy>=1.16,<2",
  "trimesh>=4.12,<5",
  "manifold3d>=3,<4",
  "rtree>=1.3,<2",
  "matplotlib>=3.10,<4",
  "torch==2.7.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masters_rgbd", "scripts"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["gpu: requires a CUDA GPU and external model weights", "data: requires external datasets"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["masters_rgbd", "scripts"]
